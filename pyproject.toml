[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pinn-canon"
version = "0.2.0"
description = "Reproducible inverse heat-conduction research laboratory"
requires-python = ">=3.12,<3.14"
dependencies = ["numpy>=2.2,<3", "scipy>=1.15,<2", "torch>=2.6,<3", "matplotlib>=3.10,<4", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.28", "ruff>=0.12"]

[project.scripts]
canon = "canon.cli:main"

[tool.setuptools.packages.find]
include = ["canon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
